agent_type: span_annotator

# Agent-specific model settings (detailed configuration)
model:
  name: phi4-mini
  temperature: 0.2
  max_context_tokens: 131072
  max_turn_tokens: 4096

# Text processor settings for agent
processor:
  max_raw_length: 512
  min_raw_length: 1
  concatenate_small_segments: false

# Dialogue session management
dialogue:
  max_turns: 12
  memory_limit: 24
  trim_strategy: rolling

# Agent behavior settings
agent:
  domain_detection: auto
  comprehensive_annotation: true
  max_spans_per_sequence: 64

templates:
  system: span_annotator_system
  user: span_annotation_request

format:
  expected_fields: [ text, start_char, end_char, xbar_class, confidence ]
  strict_json: true
  parse_strategy: json

logging:
  verbosity: info
  track_annotations: true
  log_spans: true
  log_queries: true
  log_responses: false
