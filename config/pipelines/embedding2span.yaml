# X-Spanformer Section 3.3: Span Predictor Configuration
# Implements factorized pointer networks for span boundary prediction

# Neural architecture parameters - Section 3.3
architecture:
  # Embedding dimensions - auto-discovered from vocab2embedding metadata
  embed_dim: null # Auto-discovered from metadata (overrideable via CLI)

  # Factorized Pointer Network parameters (Eqs. 15-16)
  start_projection_dim: null # Auto-discovered from embed_dim (overrideable via CLI)
  end_projection_dim: null # Auto-discovered from embed_dim (overrideable via CLI)

  # Bias initialization
  bias_init: "zeros" # Initialize bias vectors to zero (b_s, b_e = 0)

  # Regularization
  dropout_rate: 0.1

# Span prediction parameters - Section 3.3
span_prediction:
  # Top-K span selection (Proposition 1)
  top_k: 1000 # Number of top spans to select per sequence

  # Span candidate filtering
  max_span_width: null # Auto-discovered from metadata (w_max)
  min_span_width: 1 # Minimum span width to consider

# Processing configuration
processing:
  # Device for computation
  device: "cuda" # cuda | cpu (falls back to cpu if cuda unavailable)
  device_id: 0 # GPU device ID for multi-GPU systems

  # Parallel processing workers
  workers: 1 # Number of worker processes for parallel sequence processing

  # Batch processing parameters
  batch_size: 64 # Sequences per batch for boundary prediction

# Training configuration - Section 3.3
training:
  # Training hyperparameters
  epochs: 10 # Number of training epochs
  learning_rate: 1e-3 # AdamW learning rate
  weight_decay: 1e-4 # L2 regularization strength (λ_reg in Eq. 28)

  # Smoothness regularization (Eq. 30) - encourages local coherence
  smoothness_weight: 1e-5 # λ_smooth for boundary probability smoothness

  # Multi-label loss weighting strategy (Eq. 27)
  boundary_weighting: "uniform" # uniform | frequency | inverse_frequency

  # Checkpointing strategy (0 = no checkpoints, only final model)
  checkpoint_interval: 0 # Save checkpoint every N training steps (0 disables)

# Numerical Stability
numerical:
  # Small epsilon for numerical stability in calculations
  epsilon: 1e-12

  # Temperature for softmax normalization
  softmax_temperature: 1.0
